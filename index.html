<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SayPay</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SayPay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: single phone column, sticky header, bottom tab bar with central add button; ledger-green ink with a saffron accent */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#e3e7ee; --ink:#111a2e; --muted:#5a6478; --line:#d6dbe4;
  --brand:#14213d; --brand-soft:#dfe4f0; --accent:#e3c58d; --accent-soft:#f4ead6; --on-accent:#14213d; --gold:#9a7634;
  --pos:#1f7a52; --neg:#bf3f2d; --neg-soft:#f7dcd6;
  --c0:#14213d; --c1:#b98a3c; --c2:#3b6fb0; --c3:#a5466b; --c4:#5f8a2a; --c5:#7a5bb5; --c6:#c0603a; --c7:#3f8a8f; --c8:#7b7f86;
  --font-ui:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --font-brand:"Lalezar","Vazirmatn",Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --surface2:#1b2639; --ink:#e9edf5; --muted:#98a3b8; --line:#263248;
  --brand:#e3c58d; --brand-soft:#2c2a22; --accent:#e3c58d; --accent-soft:#2f2b1e; --on-accent:#14213d; --gold:#e3c58d;
  --pos:#57c792; --neg:#ef7d6b; --neg-soft:#3b1f1a;
  --c0:#9fb3dc; --c1:#e3c58d; --c2:#7aa8e6; --c3:#e083a6; --c4:#a6c95e; --c5:#ad93e6; --c6:#ec9370; --c7:#7fc5c9; --c8:#a3a8b0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --surface2:#1b2639; --ink:#e9edf5; --muted:#98a3b8; --line:#263248;
  --brand:#e3c58d; --brand-soft:#2c2a22; --accent:#e3c58d; --accent-soft:#2f2b1e; --on-accent:#14213d; --gold:#e3c58d;
  --pos:#57c792; --neg:#ef7d6b; --neg-soft:#3b1f1a;
  --c0:#9fb3dc; --c1:#e3c58d; --c2:#7aa8e6; --c3:#e083a6; --c4:#a6c95e; --c5:#ad93e6; --c6:#ec9370; --c7:#7fc5c9; --c8:#a3a8b0;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:"Vazirmatn",Helvetica,Arial,sans-serif;font-weight:800;font-size:26px;line-height:1;color:var(--brand);direction:ltr;display:inline-flex;align-items:center;gap:8px}
.brand em{font-style:normal;color:var(--gold)}
.brand svg{width:26px;height:26px;border-radius:7px}
.today{font-size:13px;color:var(--muted);text-align:left}
.store{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}
.store i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.store.ok i{background:var(--pos)}

h2{font-size:16px;font-weight:800;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{background:none;border:0;color:var(--brand);font-weight:700;font-size:13px;padding:4px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* balance */
.ledger{background:var(--brand);color:#f4ecdc;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:4px}
:root[data-theme="dark"] .ledger{color:#14213d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ledger{color:#14213d}}
.ledger .lbl{font-size:12.5px;opacity:.8}
.ledger .big{font-size:30px;font-weight:800;line-height:1.2}
.ledger .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ledger .mini{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px}
.ledger .mini b{display:block;font-size:16px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.ledger .meter{background:rgba(255,255,255,.2)}
.meter span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.over span{background:var(--neg)}

/* lists */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.item:last-child{border-bottom:0}
.dot{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:800;white-space:nowrap}
.amt.in{color:var(--pos)} .amt.out{color:var(--ink)}
.dayhead{font-size:12.5px;font-weight:700;color:var(--muted);padding:12px 2px 6px;display:flex;justify-content:space-between}
.empty{background:var(--surface);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* month switch */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:6px}
.month button{background:var(--surface2);border:0;width:38px;height:38px;border-radius:10px;font-size:18px;font-weight:800}
.month b{font-size:16px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)} .stat .v{font-weight:800;font-size:15px;overflow-wrap:anywhere}

/* budget rows */
.brow{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:right}
.brow:last-child{border-bottom:0}
.brow .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.brow .h span:first-child{font-weight:700;display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.bad{background:var(--neg-soft);color:var(--neg)}
.tag.warn{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--brand-soft);color:var(--brand)}

/* six-month chart */
.chart{background:var(--surface);border-radius:var(--r);padding:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;border-bottom:1px solid var(--line);padding-top:6px}
.bcol{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;min-width:0}
.bcol i{display:block;width:40%;max-width:16px;border-radius:5px 5px 0 0;min-height:2px}
.bcol i.in{background:var(--brand)} .bcol i.out{background:var(--accent)}
.blabels{display:flex;gap:8px;margin-top:6px}
.blabels span{flex:1;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.task:last-child{border-bottom:0}
.task.late::before{content:"";position:absolute;inset-block:10px;right:0;width:3px;border-radius:3px;background:var(--neg)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;padding:0}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:"";width:10px;height:6px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task .main{flex:1;min-width:0;background:none;border:0;text-align:right;padding:0}
.task.done .t{text-decoration:line-through;color:var(--muted)}

/* goals */
.goals{display:grid;grid-template-columns:1fr;gap:10px}
.goal{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.goal .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal .h b{font-size:16px}
.goal .acts{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.brand{background:var(--brand);color:var(--surface)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.wide{width:100%;padding:13px}

/* nav */
.nav{position:fixed;inset:auto 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.nav button[aria-current="page"]{color:var(--brand)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .add{width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);justify-self:center;margin-top:-26px;box-shadow:0 6px 16px rgba(0,0,0,.18);padding:0;justify-content:center}
.nav .add svg{width:28px;height:28px;stroke-width:2.4}

/* sheet */
.veil{position:fixed;inset:0;z-index:40;background:rgba(5,12,9,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:18px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.inp:focus{border-color:var(--brand);outline:none}
.inp.big{font-size:24px;font-weight:800;text-align:center}
.hint{font-size:12.5px;color:var(--muted);min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose button{background:var(--surface);border:0;border-radius:16px;padding:16px 14px;text-align:right;display:flex;flex-direction:column;gap:4px}
.choose b{font-size:15px}
.choose span{font-size:12.5px;color:var(--muted)}
.choose i{width:28px;height:4px;border-radius:4px;display:block;margin-bottom:6px}
.err{color:var(--neg);font-size:13px;min-height:1em}
.tip{background:var(--surface);border-radius:var(--r);padding:14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tip b{color:var(--ink)}
.qe{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line)}
.qe:focus-within{border-color:var(--gold)}
.qe-lab{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.mic{width:22px;height:22px;border-radius:7px;background:var(--brand);display:inline-block;
  -webkit-mask:linear-gradient(#000 0 0);position:relative}
.mic::before{content:"";position:absolute;inset:4px 8px 7px;border-radius:6px;background:var(--accent)}
.mic::after{content:"";position:absolute;left:9px;right:9px;bottom:3px;height:2px;background:var(--accent)}
.qe textarea{border:0;background:transparent;resize:none;font:inherit;font-size:16px;color:var(--ink);width:100%;min-height:52px;outline:none}
.qe-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qe-row .btn{flex:none}
.rv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.rv .main{flex:1;min-width:0;display:flex;flex-direction:column}
.rv .s{font-size:12.5px;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.vtag{font-size:10.5px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 5px;margin-inline-start:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:700}
</style>
</head>
<body>


<div class="app" dir="rtl" lang="fa" id="app">
  <header class="top">
    <div>
      <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#14213d"/><g stroke="#e3c58d" stroke-width="9" stroke-linecap="round"><path d="M22 42v16"/><path d="M36 30v40"/><path d="M50 18v64"/><path d="M64 30v40"/><path d="M78 42v16"/></g></svg><span>Say<em>Pay</em></span></div>
      <div class="store" id="store"><i></i><span>در حال آماده‌سازی…</span></div>
    </div>
    <div class="today" id="today"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" dir="rtl" aria-label="بخش‌ها">
  <div class="nav-in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>خانه</button>
    <button data-tab="tx"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>دخل و خرج</button>
    <button class="add" data-act="add" aria-label="افزودن"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>کارها</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>بودجه و هدف</button>
  </div>
</nav>

<div id="sheetRoot"></div>

<script>
(function(){
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','fa');

/* ---------- categories ---------- */
const OUT = [
  {k:'food',n:'خوراک و خواربار',c:0},{k:'eatout',n:'رستوران و پذیرایی',c:6},{k:'home',n:'خانه و خانوار',c:2},{k:'bills',n:'قبوض',c:1},
  {k:'transport',n:'سوخت و رفت‌وآمد',c:7},{k:'car',n:'خودرو و تعمیر',c:3},{k:'build',n:'مصالح و ساخت‌وساز',c:5},{k:'repair',n:'لوازم و تعمیرات',c:4},
  {k:'labor',n:'دستمزد',c:8},{k:'health',n:'درمان و دارو',c:4},{k:'family',n:'ماهیانه و کمک خانواده',c:5},{k:'debt',n:'بدهی، قسط و وام',c:3},
  {k:'personal',n:'روزمره شخصی',c:6},{k:'shop',n:'پوشاک و خرید',c:3},{k:'digital',n:'اشتراک دیجیتال',c:2},{k:'pet',n:'حیوان خانگی',c:1},
  {k:'fun',n:'تفریح و سفر',c:5},{k:'edu',n:'آموزش',c:6},{k:'other',n:'سایر',c:8}
];
const IN = [{k:'salary',n:'حقوق',c:0},{k:'free',n:'کار آزاد',c:2},{k:'gift',n:'هدیه',c:5},{k:'other_in',n:'سایر درآمد',c:8}];
const TAGS = ['شخصی','کار','قبض','قسط','خرید'];
const catOf = k => (k==='loan'&&(k='debt'), OUT.find(c=>c.k===k) || IN.find(c=>c.k===k) || {k:'other',n:'سایر',c:8});
const col = c => `var(--c${c})`;

/* ---------- format helpers ---------- */
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa = n => Number(n||0).toLocaleString('fa-IR');
const faY = n => Number(n).toLocaleString('fa-IR',{useGrouping:false});
const signed = n => n<0 ? '\u2066−'+fa(Math.abs(n))+'\u2069' : fa(n);
const money = n => signed(Math.round(n)) + ' تومان';
const short = n => { n=Math.round(n); const a=Math.abs(n);
  if(a>=1e9) return signed(+(n/1e9).toFixed(1))+' میلیارد'; if(a>=1e6) return signed(+(n/1e6).toFixed(1))+' میلیون'; if(a>=1e3) return signed(Math.round(n/1e3))+' هزار'; return signed(n); };
const toEn = s => String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const parseAmt = s => { const v = parseInt(toEn(s).replace(/[^\d]/g,''),10); return isNaN(v)?0:v; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const jfmt = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
const jcache = {};
function jp(iso){ if(jcache[iso]) return jcache[iso]; const o={};
  jfmt.formatToParts(new Date(iso+'T12:00:00')).forEach(p=>{ if(p.type==='year'||p.type==='month'||p.type==='day') o[p.type[0]]=parseInt(p.value,10); });
  return (jcache[iso]=o); }
const mkey = (y,m) => y*100+m;
const isoMK = iso => { const j=jp(iso); return mkey(j.y,j.m); };
const mLabel = (y,m) => `${MONTHS[m-1]} ${faY(y)}`;
const wd = new Intl.DateTimeFormat('fa-IR',{weekday:'long'});
function dayLabel(iso){ const t=todayISO(); if(iso===t) return 'امروز'; if(iso===addDays(t,-1)) return 'دیروز'; if(iso===addDays(t,1)) return 'فردا';
  const j=jp(iso); return `${wd.format(new Date(iso+'T12:00:00'))} ${fa(j.d)} ${MONTHS[j.m-1]}`; }
const shiftM = (y,m,d) => { let t=y*12+(m-1)+d; return {y:Math.floor(t/12), m:t%12+1}; };

/* ---------- store: Claude account (db) with on-device fallback ---------- */
let items = {}; let mode = 'local'; let colRef = null;
const LS='daftarche.v1';
function loadLocal(){ try{ items = JSON.parse(localStorage.getItem(LS)||'{}')||{}; }catch(e){ items={}; } }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(items)); }catch(e){} }
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function put(id,obj){ items[id]=obj; saveLocal(); render(); }
function del(id){ delete items[id]; saveLocal(); render(); }
function setStore(ok,txt){ const el=document.getElementById('store'); el.className='store'+(ok?' ok':''); el.querySelector('span').textContent=txt; }
function initStore(){
  loadLocal(); render();
  const upd=()=>setStore(true, navigator.onLine? 'ذخیره روی همین گوشی' : 'آفلاین · ذخیره روی همین گوشی');
  upd(); addEventListener('online',upd); addEventListener('offline',upd);
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
}

/* ---------- backup ---------- */
function backupName(){ const j=jp(todayISO()); return `daftarche-${j.y}-${pad(j.m)}-${pad(j.d)}.json`; }
async function doBackup(){
  const data=JSON.stringify({app:'daftarche',version:1,exported:new Date().toISOString(),items},null,1);
  const name=backupName();
  try{
    const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'پشتیبان دفترچه'}); try{localStorage.setItem(LS+'.last',todayISO());}catch(e){} render(); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
  try{localStorage.setItem(LS+'.last',todayISO());}catch(e){} render();
}
function lastBackup(){ try{ return localStorage.getItem(LS+'.last')||''; }catch(e){ return ''; } }
function sheetRestore(){
  openSheet(`<h3>بازگردانی از پشتیبان</h3>
    <div class="small muted">فایل پشتیبان (‎.json) را انتخاب کنید. اطلاعات فعلی این گوشی با محتوای فایل جایگزین می‌شود.</div>
    <input class="inp" type="file" id="rf" accept="application/json,.json">
    <div class="err" id="err"></div>
    <button class="btn pri wide" id="go" disabled>جایگزینی اطلاعات</button>`, sh=>{
      let data=null; const go=sh.querySelector('#go'), err=sh.querySelector('#err');
      sh.querySelector('#rf').addEventListener('change',e=>{
        const f=e.target.files[0]; if(!f) return; const r=new FileReader();
        r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j||typeof j.items!=='object') throw 0; data=j.items;
          err.style.color='var(--muted)'; err.textContent=`${fa(Object.keys(data).length)} مورد در فایل پیدا شد.`; go.disabled=false; }
          catch(x){ data=null; go.disabled=true; err.style.color=''; err.textContent='این فایل پشتیبان دفترچه نیست.'; } };
        r.readAsText(f);
      });
      let armed=false;
      go.addEventListener('click',()=>{ if(!data) return; if(!armed){ armed=true; go.textContent='برای تأیید دوباره بزنید'; return; }
        items=data; saveLocal(); closeSheet(); render(); toast('اطلاعات بازگردانی شد'); });
    });
}

/* ---------- selectors ---------- */
const all = k => Object.entries(items).filter(([,v])=>v&&v.kind===k).map(([id,v])=>({id,...v}));
const txIn = (y,m) => all('tx').filter(t=>isoMK(t.date)===mkey(y,m));
function sums(list){ let i=0,o=0; list.forEach(t=>{ if(t.type==='in') i+=t.amount; else o+=t.amount; }); return {i,o}; }
function spendByCat(list){ const r={}; list.forEach(t=>{ if(t.type==='out') r[t.cat]=(r[t.cat]||0)+t.amount; }); return r; }
const budgets = () => { const b={}; all('budget').forEach(x=>b[x.cat]=x); return b; };

/* ---------- state ---------- */
const T = jp(todayISO());
const st = { scope:'all', qe:'', tab:'home', vy:T.y, vm:T.m, filter:'all', tseg:'today', py:T.y, pm:T.m };

/* ---------- views ---------- */
function txRow(t){
  const c=catOf(t.cat); const sign=t.type==='in'?'+':'−';
  return `<button class="item" data-act="edit-tx" data-id="${t.id}">
    <span class="dot" style="background:${col(c.c)}">${esc(c.n.slice(0,1))}</span>
    <span class="main"><span class="t" style="display:block">${esc(t.note||c.n)}</span><span class="s">${esc(c.n)}${t.scope==='villa'?'<span class="vtag">ویلا</span>':''} · ${dayLabel(t.date)}</span></span>
    <span class="amt num ${t.type}">${sign}${fa(t.amount)}</span></button>`;
}
function taskRow(t){
  const late = !t.done && t.due && t.due < todayISO();
  const when = t.due ? dayLabel(t.due) + (t.time? ' · ساعت '+fa(t.time.split(':')[0])+':'+toFa(t.time.split(':')[1]):'') : 'بدون تاریخ';
  return `<div class="task ${t.done?'done':''} ${late?'late':''}">
    <button class="chk ${t.done?'on':''}" data-act="toggle" data-id="${t.id}" aria-label="${t.done?'برگرداندن':'انجام شد'}"></button>
    <button class="main" data-act="edit-task" data-id="${t.id}"><span class="t" style="display:block">${esc(t.title)}</span>
      <span class="s">${late?'<span style="color:var(--neg);font-weight:700">عقب‌افتاده · </span>':''}${when}${t.amount?' · '+money(t.amount):''}</span></button>
    ${t.repeat&&t.repeat!=='none'?`<span class="tag">${REPEAT_N[t.repeat]}</span>`:''}${t.tag?`<span class="tag">${esc(t.tag)}</span>`:''}</div>`;
}
const toFa = s => String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function emptyBox(text, sample){
  return `<div class="empty"><span>${text}</span>${sample?`<button class="btn" data-act="sample">نمایش با داده‌های نمونه</button>`:''}</div>`;
}

function vHome(){
  const list=txIn(T.y,T.m); const s=sums(list); const b=budgets();
  const totalLimit=Object.values(b).reduce((a,x)=>a+x.limit,0);
  const pct = totalLimit? Math.min(100, s.o/totalLimit*100) : 0;
  const tasks=all('task').filter(t=>!t.done && (!t.due || t.due<=todayISO())).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  const upcomingBills=all('task').filter(t=>!t.done && t.due>todayISO() && t.due<=addDays(todayISO(),7) && (t.tag==='قبض'||t.tag==='قسط'));
  const recent=all('tx').sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created)).slice(0,5);
  const goals=all('goal');
  const nothing = !Object.keys(items).length;
  return `
  <section class="ledger">
    <div><div class="lbl">مانده ${MONTHS[T.m-1]}</div><div class="big num">${money(s.i-s.o)}</div></div>
    <div class="row">
      <div class="mini"><span class="lbl">درآمد</span><b class="num">${short(s.i)}</b></div>
      <div class="mini"><span class="lbl">هزینه</span><b class="num">${short(s.o)}</b></div>
    </div>
    ${totalLimit?`<div><div class="lbl" style="display:flex;justify-content:space-between"><span>از بودجه ماه</span><span class="num">${fa(Math.round(s.o/totalLimit*100))}٪</span></div>
      <div class="meter ${s.o>totalLimit?'over':''}" style="margin-top:6px"><span style="width:${pct}%"></span></div></div>`:''}
  </section>
  ${quickBox()}
  ${nothing? `<div class="sec">${emptyBox('هنوز چیزی ثبت نکرده‌اید. با دکمه زرد پایین صفحه اولین هزینه، درآمد، کار یا هدف را اضافه کنید، یا فایل اکسل قبلی‌تان را از پایین صفحه وارد کنید.', true)}</div>`:''}
  <section class="sec">
    <div class="sec-h"><h2>کارهای امروز</h2><button class="link" data-tab="tasks">همه کارها</button></div>
    ${tasks.length? `<div class="list">${tasks.slice(0,5).map(taskRow).join('')}</div>` : emptyBox('کار باز امروز ندارید.')}
    ${upcomingBills.length? `<div class="small muted">${fa(upcomingBills.length)} قبض یا قسط در ۷ روز آینده سررسید دارد.</div>`:''}
  </section>
  ${goals.length?`<section class="sec"><div class="sec-h"><h2>اهداف پس‌انداز</h2><button class="link" data-tab="plan">جزئیات</button></div>
    <div class="list">${goals.map(g=>{const p=Math.min(100,g.saved/g.target*100||0);return `<button class="brow" data-act="deposit" data-id="${g.id}"><div class="h"><span>${esc(g.name)}</span><span class="small muted num">${fa(Math.round(p))}٪</span></div><div class="meter"><span style="width:${p}%;background:var(--brand)"></span></div></button>`}).join('')}</div></section>`:''}
  <section class="sec">
    <div class="sec-h"><h2>آخرین تراکنش‌ها</h2><button class="link" data-tab="tx">همه</button></div>
    ${recent.length? `<div class="list">${recent.map(txRow).join('')}</div>` : emptyBox('هنوز تراکنشی ثبت نشده.')}
  </section>
  <section class="sec"><div class="tip"><b>پشتیبان‌گیری</b>
    <span>اطلاعات فقط روی همین گوشی است. هر چند وقت یک‌بار پشتیبان بگیرید و فایلش را در Files یا تلگرام نگه دارید.${lastBackup()?' آخرین پشتیبان: '+dayLabel(lastBackup())+'.':' هنوز پشتیبانی نگرفته‌اید.'}</span>
    <div class="two" style="margin-top:6px"><button class="btn brand" data-act="backup">گرفتن پشتیبان</button><button class="btn" data-act="restore">بازگردانی</button></div></div></section>
  <section class="sec"><div class="tip"><b>اکسل</b>
    <span>هزینه‌ها را به اکسل ببرید یا فایل اکسلی که قبلاً داشتید (مثلاً از ChatGPT) را وارد کنید. موارد تکراری خودکار کنار گذاشته می‌شوند.</span>
    <div class="two" style="margin-top:6px"><button class="btn brand" data-act="export">خروجی اکسل</button><button class="btn" data-act="import">ورود از اکسل</button></div></div></section>`;
}

function monthBar(y,m,act){
  return `<div class="month"><button data-act="${act}" data-d="-1" aria-label="ماه قبل">›</button><b>${mLabel(y,m)}</b><button data-act="${act}" data-d="1" aria-label="ماه بعد">‹</button></div>`;
}

function vTx(){
  let list=txIn(st.vy,st.vm); if(st.scope!=='all') list=list.filter(t=>(t.scope||'personal')===st.scope); const s=sums(list);
  const villaOut=txIn(st.vy,st.vm).filter(t=>t.type==='out'&&t.scope==='villa').reduce((a,t)=>a+t.amount,0);
  if(st.filter!=='all') list=list.filter(t=>t.type===st.filter);
  list.sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));
  const groups={}; list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  return `<div class="sec" style="margin-top:4px">
    ${monthBar(st.vy,st.vm,'vm')}
    <div class="stats">
      <div class="stat"><div class="k">درآمد</div><div class="v num" style="color:var(--pos)">${short(s.i)}</div></div>
      <div class="stat"><div class="k">هزینه</div><div class="v num">${short(s.o)}</div></div>
      <div class="stat"><div class="k">مانده</div><div class="v num" style="color:${s.i-s.o<0?'var(--neg)':'var(--ink)'}">${short(s.i-s.o)}</div></div>
    </div>
    <div class="seg" role="group" aria-label="فیلتر">
      ${[['all','همه'],['out','هزینه‌ها'],['in','درآمدها']].map(([k,n])=>`<button data-act="filter" data-k="${k}" aria-pressed="${st.filter===k}">${n}</button>`).join('')}
    </div>
    <div class="seg" role="group" aria-label="حوزه">
      ${[['all','همه حوزه‌ها'],['personal','شخصی/خانوادگی'],['villa','ویلا'+(villaOut?' · '+short(villaOut):'')]].map(([k,n])=>`<button data-act="scope" data-k="${k}" aria-pressed="${st.scope===k}">${n}</button>`).join('')}
    </div>
    <div>${Object.keys(groups).length? Object.entries(groups).map(([d,ts])=>{
        const o=ts.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0);
        return `<div class="dayhead"><span>${dayLabel(d)}</span><span class="num">${o?'خرج '+fa(o):''}</span></div><div class="list">${ts.map(txRow).join('')}</div>`;
      }).join('') : emptyBox('در این ماه تراکنشی نیست.', !Object.keys(items).length)}</div>
  </div>`;
}

function vTasks(){
  const t=todayISO(); const ts=all('task');
  let list;
  if(st.tseg==='today') list=ts.filter(x=>!x.done && (!x.due || x.due<=t));
  else if(st.tseg==='next') list=ts.filter(x=>!x.done && x.due>t);
  else list=ts.filter(x=>x.done);
  list.sort((a,b)=>((a.due||'')+(a.time||'')).localeCompare((b.due||'')+(b.time||'')));
  if(st.tseg==='done') list.reverse();
  const cnt = k => k==='today'? ts.filter(x=>!x.done&&(!x.due||x.due<=t)).length : k==='next'? ts.filter(x=>!x.done&&x.due>t).length : ts.filter(x=>x.done).length;
  return `<div class="sec" style="margin-top:4px">
    <div class="seg" role="group" aria-label="نمایش کارها">
      ${[['today','امروز'],['next','پیش‌رو'],['done','انجام‌شده']].map(([k,n])=>`<button data-act="tseg" data-k="${k}" aria-pressed="${st.tseg===k}">${n} <span class="num">(${fa(cnt(k))})</span></button>`).join('')}
    </div>
    ${list.length? `<div class="list">${list.map(taskRow).join('')}</div>` : emptyBox(st.tseg==='done'?'کار انجام‌شده‌ای نیست.':'کاری در این بخش نیست. با دکمه + یک کار یا یادآور قبض اضافه کنید.')}
    ${st.tseg==='done'&&list.length?`<button class="btn" data-act="cleardone">پاک کردن کارهای انجام‌شده</button>`:''}
    ${st.tseg!=='done'?`<div class="tip"><b>آلارم روی آیفون</b><span>کارهای تاریخ‌دار را به تقویم آیفون اضافه کنید تا سر وقت هشدار بدهد، حتی وقتی SayPay بسته است و اینترنت ندارید.</span><button class="btn brand" style="margin-top:6px" data-act="calall">افزودن همه کارهای پیش‌رو به تقویم</button></div>`:''}
  </div>`;
}

function vPlan(){
  const y=st.py,m=st.pm; const list=txIn(y,m); const by=spendByCat(list); const b=budgets();
  const cats=OUT.filter(c=>b[c.k]||by[c.k]);
  const rest=OUT.filter(c=>!b[c.k]&&!by[c.k]);
  // six months
  const cols=[]; for(let i=5;i>=0;i--){ const p=shiftM(y,m,-i); cols.push({...p, ...sums(txIn(p.y,p.m))}); }
  const mx=Math.max(1,...cols.map(c=>Math.max(c.i,c.o)));
  const goals=all('goal');
  return `<div class="sec" style="margin-top:4px">
    ${monthBar(y,m,'pm')}
    <div class="sec-h"><h2>بودجه دسته‌ها</h2><span class="small muted">برای تعیین سقف، روی دسته بزنید</span></div>
    ${cats.length?`<div class="list">${cats.map(c=>{
      const sp=by[c.k]||0, lim=b[c.k]?b[c.k].limit:0, p=lim?sp/lim*100:0;
      const tag = !lim? '<span class="tag">بدون سقف</span>' : p>100? `<span class="tag bad">${fa(Math.round(p-100))}٪ بیش از سقف</span>` : p>=80? '<span class="tag warn">نزدیک سقف</span>' : '<span class="tag good">در محدوده</span>';
      return `<button class="brow" data-act="budget" data-k="${c.k}"><div class="h"><span><i class="sw" style="background:${col(c.c)}"></i>${c.n}</span>${tag}</div>
        ${lim?`<div class="meter ${p>100?'over':''}"><span style="width:${Math.min(100,p)}%;background:${p>100?'var(--neg)':col(c.c)}"></span></div>`:''}
        <div class="small muted num">${fa(sp)}${lim?' از '+fa(lim):''} تومان</div></button>`;}).join('')}</div>`
      : emptyBox('برای دسته‌ها سقف ماهانه تعیین کنید تا ببینید کجا بیش از حد خرج می‌کنید.')}
    ${rest.length?`<div class="chips">${rest.map(c=>`<button class="chip" data-act="budget" data-k="${c.k}">+ ${c.n}</button>`).join('')}</div>`:''}
  </div>
  <section class="sec">
    <h2>شش ماه اخیر</h2>
    <div class="chart">
      <div class="bars">${cols.map(c=>`<div class="bcol" title="${mLabel(c.y,c.m)}"><i class="in" style="height:${c.i/mx*100}%"></i><i class="out" style="height:${c.o/mx*100}%"></i></div>`).join('')}</div>
      <div class="blabels">${cols.map(c=>`<span>${MONTHS[c.m-1]}</span>`).join('')}</div>
      <div class="legend"><span><i class="sw" style="background:var(--brand)"></i>درآمد</span><span><i class="sw" style="background:var(--accent)"></i>هزینه</span><span class="num">بیشینه: ${short(mx)}</span></div>
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>اهداف پس‌انداز</h2><button class="link" data-act="new-goal">+ هدف جدید</button></div>
    ${goals.length?`<div class="goals">${goals.map(g=>{const p=Math.min(100,g.saved/g.target*100||0); const left=Math.max(0,g.target-g.saved);
      return `<div class="goal"><div class="h"><div><b>${esc(g.name)}</b><div class="small muted num">${fa(g.saved)} از ${fa(g.target)} تومان</div></div><span class="tag ${p>=100?'good':''}">${p>=100?'رسیدید!':fa(Math.round(p))+'٪'}</span></div>
      <div class="meter"><span style="width:${p}%;background:var(--brand)"></span></div>
      <div class="small muted">${left?'مانده: '+money(left):'این هدف کامل شده است.'}</div>
      <div class="acts"><button class="btn brand" data-act="deposit" data-id="${g.id}">واریز</button><button class="btn" data-act="edit-goal" data-id="${g.id}">ویرایش</button></div></div>`;}).join('')}</div>`
    : emptyBox('یک هدف تعریف کنید، مثل «صندوق اضطراری» یا «سفر عید»، و هر بار که پس‌انداز کردید واریز بزنید.')}
  </section>`;
}

function render(){
  document.getElementById('today').innerHTML = `${wd.format(new Date())}<br><b class="num">${fa(T.d)} ${MONTHS[T.m-1]} ${faY(T.y)}</b>`;
  const v = {home:vHome, tx:vTx, tasks:vTasks, plan:vPlan}[st.tab]();
  document.getElementById('view').innerHTML = v;
  document.querySelectorAll('.nav [data-tab]').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===st.tab?'page':'false'));
}

/* ---------- sheets ---------- */
const root=document.getElementById('sheetRoot');
function openSheet(html, onMount){
  root.innerHTML = `<div class="veil" data-act="close"><div class="sheet" dir="rtl" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div></div>`;
  const sh=root.querySelector('.sheet'); sh.addEventListener('click',e=>e.stopPropagation());
  onMount && onMount(sh);
}
const closeSheet = () => root.innerHTML='';
function chipsHTML(name, opts, cur){ return `<div class="chips" data-group="${name}">${opts.map(([k,n])=>`<button type="button" class="chip" data-v="${esc(k)}" aria-pressed="${k===cur}">${esc(n)}</button>`).join('')}</div>`; }
function wireChips(sh, onPick){ sh.querySelectorAll('.chips[data-group]').forEach(g=>g.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return; g.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onPick&&onPick(g.dataset.group,b.dataset.v); })); }
const picked = (sh,name) => { const b=sh.querySelector(`.chips[data-group="${name}"] .chip[aria-pressed="true"]`); return b?b.dataset.v:''; };
function wireAmount(sh,id){ const i=sh.querySelector('#'+id), h=sh.querySelector('#'+id+'-h');
  const f=()=>{ const v=parseAmt(i.value); h.textContent = v? money(v) + (v>=1e6?' ('+short(v)+')':'') : ''; }; i.addEventListener('input',f); f(); }
function deleteBtn(sh, fn){ const b=sh.querySelector('[data-del]'); if(!b) return; let armed=false;
  b.addEventListener('click',()=>{ if(!armed){ armed=true; b.textContent='برای حذف دوباره بزنید'; setTimeout(()=>{armed=false; b.textContent='حذف';},3000); return; } fn(); closeSheet(); }); }
function dateField(id,val){ return `<input class="inp" type="date" id="${id}" value="${val}"><div class="hint" id="${id}-h"></div>`; }
function wireDate(sh,id){ const i=sh.querySelector('#'+id), h=sh.querySelector('#'+id+'-h'); const f=()=>{ h.textContent = i.value? dayLabel(i.value)+' — '+fa(jp(i.value).d)+' '+MONTHS[jp(i.value).m-1]+' '+faY(jp(i.value).y) : ''; }; i.addEventListener('change',f); i.addEventListener('input',f); f(); }

function categorize(...texts){
  for(const t of texts){ const s=norm(t); if(!s) continue; for(const [k,re] of CAT_RULES) if(re.test(s)) return k; }
  return 'other';
}

/* ---------- numbers in words ---------- */
const NUMW = {'صفر':0,'یک':1,'یه':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'شیش':6,'هفت':7,'هشت':8,'نه':9,'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'پانزده':15,'پونزده':15,'شانزده':16,'شونزده':16,'هفده':17,'هیفده':17,'هجده':18,'هیجده':18,'نوزده':19,'بیست':20,'سی':30,'چهل':40,'پنجاه':50,'شصت':60,'هفتاد':70,'هشتاد':80,'نود':90,'صد':100,'یکصد':100,'یک صد':100,'دویست':200,'سیصد':300,'چهارصد':400,'پانصد':500,'پونصد':500,'ششصد':600,'شیشصد':600,'هفتصد':700,'هشتصد':800,'نهصد':900,'نیم':0.5};
const SCALE = {'هزار':1e3,'تومنی':0,'میلیون':1e6,'ملیون':1e6,'میلیارد':1e9,'ملیارد':1e9};
const isNumTok = w => /^\d+(\.\d+)?$/.test(w) || (w in NUMW) || (SCALE[w]>0);
function readNumberRuns(tokens){
  const runs=[]; let i=0;
  while(i<tokens.length){
    if(!isNumTok(tokens[i]) || (tokens[i]==='نه' && !(tokens[i+1] && isNumTok(tokens[i+1])) && !(tokens[i-1]==='و'))){ i++; continue; }
    const start=i; let total=0, cur=0, hasScale=false, hasWord=false, lastScale=0;
    while(i<tokens.length){
      const w=tokens[i];
      if(/^\d+(\.\d+)?$/.test(w)){ cur+=parseFloat(w); i++; }
      else if(w in NUMW){ cur+=NUMW[w]; hasWord=true; i++; }
      else if(SCALE[w]>0){ total+=(cur||1)*SCALE[w]; cur=0; hasScale=true; lastScale=SCALE[w]; i++; }
      else if(w==='و' && tokens[i+1] && isNumTok(tokens[i+1])){ i++; }
      else break;
    }
    if(hasScale && cur>0 && cur<1000 && lastScale>=1e6) cur=cur*lastScale/1000;
    total+=cur;
    runs.push({start,end:i,value:total,hasScale,hasWord});
  }
  return runs;
}

const WEEK = [['پنجشنبه',4],['چهارشنبه',3],['سهشنبه',2],['دوشنبه',1],['یکشنبه',0],['جمعه',5],['شنبه',6]];
function j2g(jy,jm,jd){
  jy+=1595; let days=-355668+(365*jy)+(~~(jy/33)*8)+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*~~(days/146097); days%=146097;
  if(days>36524){ gy+=100*~~(--days/36524); days%=36524; if(days>=365) days++; }
  gy+=4*~~(days/1461); days%=1461;
  if(days>365){ gy+=~~((days-1)/365); days=(days-1)%365; }
  let gd=days+1; const ml=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];

function parseWhen(s, future){
  const t=todayISO(); const flat=s.replace(/ /g,'');
  let date=null, used=[];
  const rel=[['پس فردا',2],['پسفردا',2],['فردا',1],['پریروز',-2],['دیروز',-1],['امروز',0],['امشب',0],['دیشب',-1]];
  for(const [w,d] of rel){ if(s.includes(w)){ date=addDays(t,d); used.push(w); break; } }
  if(!date){ const m=s.match(/(\d{1,2}) ?(?:ام )?(فروردین|اردیبهشت|خرداد|تیر|مرداد|شهریور|مهر|آبان|آذر|دی|بهمن|اسفند)/);
    if(m){ const T0=jp(t); let y=T0.y; const mi=MONTHS.indexOf(m[2])+1; let iso=j2g(y,mi,+m[1]);
      if(!future && iso>t) iso=j2g(y-1,mi,+m[1]); if(future && iso<t) iso=j2g(y+1,mi,+m[1]); date=iso; used.push(m[0]); } }

  if(!date){ for(const [w,wd] of WEEK){ if(flat.includes(w)){ const now=new Date(t+'T12:00:00').getDay(); let diff=(wd-now+7)%7;
      if(future){ if(diff===0 && /بعد|آینده/.test(s)) diff=7; date=addDays(t,diff); } else { date=addDays(t, diff===0?0:diff-7); }
      used.push(w); break; } } }

  const tm=s.match(/ساعت (\d{1,2})(?:[: ](\d{1,2}))?( و نیم| و ربع)?/) || s.match(/(\d{1,2}):(\d{2})/);
  if(tm){ let h=+tm[1], mi=tm[2]?+tm[2]:0; if(tm[3]) mi = tm[3].includes('نیم')?30:15;
    if(/عصر|بعد ?از ?ظهر|شب/.test(s) && h<12) h+=12; else if(/ظهر/.test(s) && h<6) h+=12;
    if(h<24 && mi<60){ time=`${pad(h)}:${pad(mi)}`; used.push(tm[0]); } }
  return {date, time, used};
}

/* ---------- one sentence → tx or task ---------- */
function parseSentence(raw){
  const s=norm(raw).replace(/[.!؟?،]+$/,''); if(!s) return null;
  const isTask = /یادم بنداز|یادآوری|یاد آوری|یادآور|باید|قرار|جلسه|زنگ بزنم|تماس بگیرم|برم|پرداخت کنم|بدم|بخرم|کار دارم|نوبت/.test(s);
  const pastSpend = /خریدم|گرفتم|دادم|پرداختم|پرداخت کردم|ریختم|زدم|خرج کردم|شد|واریز کردم|حساب کردم|هزینه/.test(s);
  const isIncome = IN_RE.test(s) && !/دادم|پرداخت/.test(s);
  const kind = isTask && !pastSpend ? 'task' : 'tx';
  const when = parseWhen(s, kind==='task');
  // amount: drop the time and date digits first
  let rest=s; when.used.forEach(u=>{ rest=rest.replace(u,' '); });
  const tokens=rest.split(' ').filter(Boolean);
  const runs=readNumberRuns(tokens).filter(r=>r.value>0);
  let amount=0, guess=false, run=null;
  runs.forEach(r=>{ if(!run || r.value>run.value) run=r; });
  if(run){
    amount=run.value; const after=tokens[run.end]||'';
    if(/ریال/.test(after)) amount=Math.round(amount/10);
    else if(!run.hasScale && amount<1000){ amount*=1000; guess=true; }
    amount=Math.round(amount);
  }
  // description: remove the number run, money words and filler
  let words=tokens.slice(); if(run) words.splice(run.start, run.end-run.start);
  let note=words.join(' ').replace(/\b(تومن|تومان|ریال|تومنی)\b/g,' ')
    .replace(/(تومن|تومان|ریال)/g,' ').replace(/یادم بنداز|یادآوری کن|یادآور|یادآوری/g,' ')
    .replace(/(^|\s)(صبح|ظهر|عصر|شب|بعد از ظهر|بعدازظهر)(?=\s|$)/g,' ').replace(/\s(شد|بود)$/,'').replace(/^\s*(من|برای|بابت)\s+/,'').replace(/\s+/g,' ').trim();
  const scope = /ویلا/.test(s)? 'villa':'personal';
  if(kind==='task'){
    const tag = /قبض|برق|گاز|آب|اینترنت/.test(s)?'قبض': /قسط|وام/.test(s)?'قسط': /بخرم|خرید/.test(s)?'خرید': /جلسه|اداره|کار/.test(s)?'کار':'شخصی';
    return {kind:'task', title:note||s, due:when.date||(when.time?todayISO():''), time:when.time, tag, amount, guess, remind:15, repeat:'none', raw};
  }
  const type = isIncome? 'in':'out';
  const cat = type==='in' ? (/حقوق/.test(s)?'salary': /فروش|فروختم|پروژه|آزاد/.test(s)?'free':'other_in') : categorize(note,s);
  return {kind:'tx', type, amount, cat, note:note||s, date:when.date||todayISO(), scope, guess, raw};
}
function parseAll(text){
  return String(text||'').split(/\n|\.\s|؛|(?:\s+و\s+بعد\s+)/).map(x=>x.trim()).filter(Boolean).map(parseSentence).filter(Boolean);
}

/* ---------- saving a file on the phone ---------- */
async function saveFile(blob, name, title){
  try{ const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return true; } }
  catch(e){ if(e && e.name==='AbortError') return false; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); return true;
}

}
function cellDate(v, prev){
  if(typeof v==='number' && v>20000 && v<80000){ const d=new Date(Date.UTC(1899,11,30)+v*864e5); return d.toISOString().slice(0,10); }
  const s=norm(v); if(!s) return prev;
  let m=s.match(/(\d{2,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){ let y=+m[1]; if(y<100) y+=1400; if(y>1900) return `${y}-${pad(m[2])}-${pad(m[3])}`; if(y>1300&&y<1500) return j2g(y,+m[2],+m[3]); }
  const w=parseWhen(s,false); return w.date||prev;
}
function mapSheet(rows){
  const H={date:/تاریخ|^روز$|date/i, scope:/حوزه|بخش/, cat:/دسته|گروه|category/i, desc:/شرح|توضیح|عنوان|بابت|^مورد|کالا|description|item/i,
    payee:/طرف|فروشنده|گیرنده|پرداخت ?به/, method:/روش|نحوه/, memo:/یادداشت|ملاحظات|note/i, type:/^نوع$|type/i, amount:/مبلغ|قیمت|تومان|ریال|amount|price|cost|هزینه|جمع/i};
  for(let r=0;r<Math.min(rows.length,12);r++){
    const cols={}; (rows[r]||[]).forEach((h,ci)=>{ const s=norm(h); if(!s) return;
      for(const k of ['date','scope','cat','desc','payee','method','memo','type','amount']) if(H[k].test(s) && cols[k]===undefined){ cols[k]=ci; if(k==='amount') cols.amountH=s; break; } });
    if(cols.date!==undefined && cols.amount!==undefined) return {head:r, cols};
  }
  return null;
}
function rowsToTx(rows, m){
  const c=m.cols, out=[]; let prev=null; const mult = /ریال/.test(c.amountH||'')? 0.1 : /هزار/.test(c.amountH||'')? 1000 : 1;
  for(let r=m.head+1;r<rows.length;r++){
    const row=rows[r]||[]; const g=k=> c[k]===undefined? '' : (row[c[k]]??'');
    const text=row.map(x=>norm(x)).join(' ');
    if(/جمع کل|مجموع|^جمع|total/i.test(norm(g('desc'))+' '+norm(row[0]))) continue;
    let a=g('amount'); a= typeof a==='number'? a : parseAmt(a); a=Math.round(a*mult); if(!a) continue;
    const date=cellDate(g('date'),prev); if(!date) continue; prev=date;
    const catT=String(g('cat')||''), desc=String(g('desc')||'').trim();
    const type = IN_RE.test(norm(catT+' '+g('type'))) ? 'in':'out';
    out.push({kind:'tx', type, amount:a, cat: type==='in'?'other_in':categorize(catT,desc), sub:catT.trim()||undefined, note:desc||catT||'بدون شرح', date,
      scope:/ویلا/.test(norm(g('scope')))?'villa':'personal', payee:String(g('payee')||'').trim()||undefined, method:String(g('method')||'').trim()||undefined, memo:String(g('memo')||'').trim()||undefined, src:'import'});
  }
  return out;
}
function sheetImport(){
  openSheet(`<h3>ورود از اکسل</h3>
    <div class="small muted">فایل اکسل (‎.xlsx) یا ‎.csv را انتخاب کنید. ستون‌های تاریخ و مبلغ لازم است؛ شرح، دسته، حوزه، طرف حساب و یادداشت هم اگر باشند خوانده می‌شوند.</div>
    <input class="inp" type="file" id="xf" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">
    <div id="xr"></div><div class="err" id="err"></div>
    <button class="btn pri wide" id="go" disabled>وارد کردن</button>`, sh=>{
      let ready=[]; const err=sh.querySelector('#err'), go=sh.querySelector('#go'), xr=sh.querySelector('#xr');
      sh.querySelector('#xf').addEventListener('change', async e=>{
        const f=e.target.files[0]; if(!f) return; err.textContent=''; xr.innerHTML='<div class="small muted">در حال خواندن…</div>'; go.disabled=true;
        try{
          let sheets;
          if(/\.csv$/i.test(f.name)) sheets=readCsv(await f.text());
          else { if(!window.DecompressionStream) throw new Error('old'); sheets=await readXlsx(await f.arrayBuffer()); }
          let best=[]; sheets.forEach(rows=>{ const m=mapSheet(rows); if(m){ const t=rowsToTx(rows,m); if(t.length>best.length) best=t; } });
          if(!best.length) throw new Error('nocols');
          const have=new Set(all('tx').map(t=>t.date+'|'+t.amount+'|'+(t.note||'')));
          const dup=best.filter(t=>have.has(t.date+'|'+t.amount+'|'+t.note)); ready=best.filter(t=>!have.has(t.date+'|'+t.amount+'|'+t.note));
          const total=ready.reduce((a,t)=>a+(t.type==='out'?t.amount:0),0); const dates=ready.map(t=>t.date).sort();
          const villa=ready.filter(t=>t.scope==='villa').length;
          xr.innerHTML = ready.length? `<div class="tip"><b>${fa(ready.length)} هزینه آماده ورود</b>
            <span>از ${dayLabel(dates[0])} تا ${dayLabel(dates[dates.length-1])} · جمع ${money(total)}${villa?' · '+fa(villa)+' مورد ویلا':''}${dup.length?' · '+fa(dup.length)+' مورد تکراری کنار گذاشته شد':''}</span></div>
            <div class="list">${ready.slice(0,5).map(t=>`<div class="item"><span class="dot" style="background:${col(catOf(t.cat).c)}">${esc(catOf(t.cat).n.slice(0,1))}</span><span class="main"><span class="t" style="display:block">${esc(t.note)}</span><span class="s">${esc(catOf(t.cat).n)} · ${dayLabel(t.date)}</span></span><span class="amt num">${fa(t.amount)}</span></div>`).join('')}</div>`
            : `<div class="tip"><b>همه این موارد قبلاً وارد شده‌اند.</b></div>`;
          go.disabled=!ready.length; go.textContent=`وارد کردن ${fa(ready.length)} مورد`;
        }catch(x){ xr.innerHTML=''; err.textContent = x.message==='old'? 'برای خواندن اکسل، iOS را به نسخه ۱۶٫۴ یا جدیدتر به‌روز کنید، یا فایل را CSV ذخیره کنید.' : x.message==='nocols'? 'ستون «تاریخ» و «مبلغ» در این فایل پیدا نشد.' : 'این فایل خوانده نشد. مطمئن شوید فایل ‎.xlsx یا ‎.csv است.'; }
      });
      go.addEventListener('click',()=>{ const now=new Date().toISOString();
        ready.forEach(t=>{ Object.keys(t).forEach(k=>t[k]===undefined&&delete t[k]); items[uid('tx')]={...t,created:now}; });
        saveLocal(); const d=ready.map(t=>t.date).sort().pop(); if(d){ const j=jp(d); st.vy=j.y; st.vm=j.m; }
        closeSheet(); st.tab='tx'; render(); toast(fa(ready.length)+' مورد وارد شد'); });
    });
}

/* ---------- calendar alarms (.ics) ---------- */
const REPEAT_N = {none:'بدون تکرار', weekly:'هفتگی', monthly:'ماهانه'};
const REMIND = [[0,'سر وقت'],[15,'۱۵ دقیقه قبل'],[60,'۱ ساعت قبل'],[1440,'۱ روز قبل']];
const icsEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsFold(line){ const out=[]; let cur=''; for(const ch of line){ if((cur+ch).length>60){ out.push(cur); cur=' '+ch; } else cur+=ch; } out.push(cur); return out.join('\r\n'); }
function icsEvents(t){
  const dates=[t.due]; if(t.repeat==='monthly') for(let i=1;i<12;i++) dates.push(addJMonths(t.due,i));
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const title=t.title+(t.amount?' — '+fa(t.amount)+' تومان':'');
  return dates.map((d,i)=>{
    const L=['BEGIN:VEVENT',`UID:${t.id||uid('t')}-${i}@saypay`,`DTSTAMP:${stamp}`];
    const dd=d.replace(/-/g,'');
    if(t.time){ const [h,mi]=t.time.split(':'); const st0=`${dd}T${h}${mi}00`; const e=new Date(`${d}T${t.time}:00`); e.setMinutes(e.getMinutes()+30);
      L.push(`DTSTART:${st0}`,`DTEND:${isoOf(e).replace(/-/g,'')}T${pad(e.getHours())}${pad(e.getMinutes())}00`); }
    else L.push(`DTSTART;VALUE=DATE:${dd}`,`DTEND;VALUE=DATE:${addDays(d,1).replace(/-/g,'')}`);
    if(t.repeat==='weekly') L.push('RRULE:FREQ=WEEKLY;COUNT=52');
    L.push('SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc('از SayPay · '+(t.tag||'')));
    const trig = t.time ? (+(t.remind??15)===0?'-PT0M': `-PT${+(t.remind??15)}M`) : (+(t.remind??15)>=1440?'-PT15H':'PT9H');
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+trig,'END:VALARM','END:VEVENT');
    return L.map(icsFold).join('\r\n');
  }).join('\r\n');
}
function openICS(list){
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SayPay//FA','CALSCALE:GREGORIAN','METHOD:PUBLISH'].join('\r\n')+'\r\n'+list.map(icsEvents).join('\r\n')+'\r\nEND:VCALENDAR\r\n';
  const url=URL.createObjectURL(new Blob([body],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='saypay-reminder.ics'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000);
}
function calendarAll(){
  const list=all('task').filter(t=>!t.done && t.due && t.due>=todayISO());
  if(!list.length){ toast('کار پیش‌رویی با تاریخ ندارید'); return; }
  openICS(list); toast(fa(list.length)+' یادآور برای تقویم آماده شد');
}

/* ---------- toast ---------- */
let tt; function toast(m){ clearTimeout(tt); let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent=m; tt=setTimeout(()=>el.remove(),2000); }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ st.tab=tab.dataset.tab; closeSheet(); render(); window.scrollTo(0,0); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  switch(act){
    case 'close': if(e.target===a) closeSheet(); break;
    case 'add': sheetChoose(); break;
    case 'new-tx': sheetTx(null,a.dataset.type); break;
    case 'new-task': sheetTask(null); break;
    case 'new-goal': sheetGoal(null); break;
    case 'edit-tx': sheetTx(id); break;
    case 'edit-task': sheetTask(id); break;
    case 'edit-goal': sheetGoal(id); break;
    case 'deposit': sheetDeposit(id); break;
    case 'budget': sheetBudget(a.dataset.k); break;
    case 'toggle': { const t=items[id]; if(!t) break; put(id,{...t,done:!t.done});
      if(!t.done && t.due && t.repeat && t.repeat!=='none'){ const nd = t.repeat==='monthly'? addJMonths(t.due,1) : addDays(t.due,7);
        put(uid('task'),{...t,done:false,due:nd,created:new Date().toISOString()}); toast('نوبت بعدی: '+dayLabel(nd)); }
      break; }
    case 'qe-go': runQuick(); break;
    case 'export': exportExcel(); break;
    case 'import': sheetImport(); break;
    case 'calall': calendarAll(); break;
    case 'scope': st.scope=a.dataset.k; render(); break;
    case 'filter': st.filter=a.dataset.k; render(); break;
    case 'tseg': st.tseg=a.dataset.k; render(); break;
    case 'vm': { const p=shiftM(st.vy,st.vm,+a.dataset.d); st.vy=p.y; st.vm=p.m; render(); break; }
    case 'pm': { const p=shiftM(st.py,st.pm,+a.dataset.d); st.py=p.y; st.pm=p.m; render(); break; }
    case 'cleardone': all('task').filter(t=>t.done).forEach(t=>del(t.id)); toast('پاک شد'); break;
    case 'sample': loadSample(); break;
    case 'backup': doBackup(); break;
    case 'restore': sheetRestore(); break;
  }
});
document.addEventListener('input',e=>{ if(e.target && e.target.id==='qe') st.qe=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

initStore();
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
